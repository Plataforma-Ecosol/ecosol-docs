name: Documentação

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: documentacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Verificar documentação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lint do Markdown
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"

      - name: Links internos do Markdown
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress "**/*.md"
          fail: true

      - name: Diagramas Graphviz válidos
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq graphviz
          shopt -s globstar nullglob
          for arquivo in **/*.dot; do
            echo "Validando $arquivo"
            dot -Tcanon "$arquivo" > /dev/null
          done
